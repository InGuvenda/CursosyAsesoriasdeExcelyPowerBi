<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursos de Excel - Sandra Infante</title>

<style>

/* RESET */
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#f5f5f5;
  padding-bottom:120px;
}

/* HEADER */
header{
  text-align:center;
  background:#0a5c36;
  color:white;
  padding:20px;
}

/* PRODUCTOS */
.productos{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.producto{
  background:white;
  padding:15px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  transition:0.3s;
}

.producto:hover{
  transform:translateY(-5px);
}

.producto img{
  width:100%;
  max-width:180px;
}

/* BOTONES */
button{
  background:#0a5c36;
  color:white;
  border:none;
  padding:10px;
  cursor:pointer;
  border-radius:5px;
  width:100%;
  margin-top:5px;
}

button:hover{
  background:#084d2c;
}

/* BOTON BLOQUEADO */
.bloqueado{
  background:gray;
  cursor:not-allowed;
}

/* CARRITO PRO */
.carrito{
  position:fixed;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  width:95%;
  max-width:500px;
  background:white;
  border-radius:15px;
  padding:15px;
  box-shadow:0 5px 20px rgba(0,0,0,0.25);
}

.carrito h3{
  margin:0 0 10px 0;
  text-align:center;
}

.carrito ul{
  max-height:120px;
  overflow:auto;
  padding:0;
  margin:0;
}

.carrito li{
  list-style:none;
  display:flex;
  justify-content:space-between;
  margin-bottom:5px;
  font-size:14px;
}

.eliminar{
  color:red;
  cursor:pointer;
  font-weight:bold;
}

/* TOTAL */
.total{
  font-weight:bold;
  text-align:center;
  margin:10px 0;
}

/* MOBILE */
@media(max-width:600px){
  header h1{
    font-size:20px;
  }

  .carrito{
    width:95%;
  }
}

</style>

</head>

<body>

<header>
  <h1>📊 Cursos de Excel & Power BI</h1>
  <p>Aprende desde cero hasta nivel profesional</p>
</header>

<section class="productos">

  <div class="producto">
    <img src="img/logo excel basico.png">
    <h2>Excel Básico</h2>
    <p>$600 MXN</p>
    <button onclick="agregarCarrito('Excel Básico',600)">Agregar al carrito</button>
    <button class="bloqueado">🔒 Disponible después de compra</button>
  </div>

  <div class="producto">
    <img src="img/logo excel intermedio.png">
    <h2>Excel Intermedio</h2>
    <p>$600 MXN</p>
    <button onclick="agregarCarrito('Excel Intermedio',600)">Agregar al carrito</button>
    <button class="bloqueado">🔒 Disponible después de compra</button>
  </div>

  <div class="producto">
    <img src="img/logo Excel Avanzado.png">
    <h2>Excel Avanzado</h2>
    <p>$600 MXN</p>
    <button onclick="agregarCarrito('Excel Avanzado',600)">Agregar al carrito</button>
    <button class="bloqueado">🔒 Disponible después de compra</button>
  </div>

  <div class="producto">
    <img src="img/logo power bi basico.png">
    <h2>Power BI Básico</h2>
    <p>$600 MXN</p>
    <button onclick="agregarCarrito('Power BI Básico',600)">Agregar al carrito</button>
    <button class="bloqueado">🔒 Disponible después de compra</button>
  </div>

</section>

<!-- 🛒 CARRITO -->
<div class="carrito">
  <h3>🛒 Carrito (<span id="contador">0</span>)</h3>

  <ul id="lista-carrito"></ul>

  <p class="total" id="total">Total: $0 MXN</p>

  <button onclick="comprar()">Comprar por WhatsApp</button>
</div>

<script>

let carrito = [];

function agregarCarrito(nombre, precio){
    carrito.push({nombre, precio});
    mostrarCarrito();
}

function eliminarProducto(index){
    carrito.splice(index,1);
    mostrarCarrito();
}

function mostrarCarrito(){
    let lista = document.getElementById("lista-carrito");
    let total = 0;

    lista.innerHTML = "";

    carrito.forEach((item, index) => {
        let li = document.createElement("li");

        li.innerHTML = `
            ${item.nombre} - $${item.precio}
            <span class="eliminar" onclick="eliminarProducto(${index})">❌</span>
        `;

        lista.appendChild(li);
        total += item.precio;
    });

    document.getElementById("total").textContent = "Total: $" + total + " MXN";
    document.getElementById("contador").textContent = carrito.length;
}

function comprar(){
    if(carrito.length === 0){
        alert("Tu carrito está vacío");
        return;
    }

    let mensaje = "Hola, quiero comprar:%0A";

    carrito.forEach(item => {
        mensaje += "- " + item.nombre + "%0A";
    });

    let total = carrito.reduce((acc, item) => acc + item.precio, 0);

    mensaje += "Total: $" + total + " MXN";

    let telefono = "523333945657";

    let url = "https://wa.me/" + telefono + "?text=" + mensaje;

    window.open(url, "_blank");
}

</script>

</body>
</html>
