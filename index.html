<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursos de Excel - Sandra Infante</title>

<!-- PAYPAL MEJORADO -->
<script src="https://www.paypal.com/sdk/js?client-id=AQjsKr-mCYAxSAOx_0Azxop1vw2R7kxqC4abCeC6pZBzNLK1sNjWI3DZh6iyJtpkpHmQ7EMFyV7S7_Wr&currency=MXN&components=buttons,funding-eligibility"></script>

<style>

body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#f5f5f5;
}

header{
  text-align:center;
  background:#0a5c36;
  color:white;
  padding:20px;
}

.contenedor{
  display:flex;
  flex-wrap:wrap;
}

.productos{
  flex:3;
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.producto{
  background:white;
  padding:15px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.producto img{
  width:100%;
  max-width:180px;
}

button{
  background:#0a5c36;
  color:white;
  border:none;
  padding:10px;
  cursor:pointer;
  border-radius:5px;
}

.eliminar{
  background:red;
  padding:2px 6px;
}

.carrito{
  flex:1;
  min-width:300px;
  background:white;
  border-left:4px solid #0a5c36;
  padding:15px;
  height:100vh;
  position:sticky;
  top:0;
  overflow:auto;
}

.carrito li{
  display:flex;
  justify-content:space-between;
}

.total{
  font-weight:bold;
  margin-top:10px;
}

/* DESCARGAS */
.descargas{
  padding:20px;
  display:none;
}

.descargas a{
  display:block;
  margin:10px 0;
  color:green;
  font-weight:bold;
}

</style>
</head>

<body>

<header>
  <h1>📊 Cursos de Excel & Power BI</h1>
</header>

<div class="contenedor">

<section class="productos">

<div class="producto">
  <h2>Excel Básico</h2>
  <p>$600 MXN</p>
  <button onclick="agregarCarrito('basico',600)">Agregar</button>
</div>

<div class="producto">
  <h2>Excel Intermedio</h2>
  <p>$600 MXN</p>
  <button onclick="agregarCarrito('intermedio',600)">Agregar</button>
</div>

<div class="producto">
  <h2>Excel Avanzado</h2>
  <p>$600 MXN</p>
  <button onclick="agregarCarrito('avanzado',600)">Agregar</button>
</div>

</section>

<div class="carrito">
  <h3>🛒 Carrito</h3>
  <ul id="lista-carrito"></ul>
  <p class="total" id="total">Total: $0</p>
  <div id="paypal-button-container"></div>
</div>

</div>

<!-- 🔓 DESCARGAS -->
<div class="descargas" id="descargas">
  <h2>📥 Tus cursos</h2>

  <a id="basico" href="cursos/excel_basico.zip" target="_blank">Descargar Excel Básico</a>
  <a id="intermedio" href="cursos/excel_intermedio.zip" target="_blank">Descargar Excel Intermedio</a>
  <a id="avanzado" href="cursos/excel_avanzado.zip" target="_blank">Descargar Excel Avanzado</a>
</div>

<script>

let carrito = [];
let total = 0;

function agregarCarrito(nombre, precio){
  carrito.push({nombre, precio});
  total += precio;
  mostrarCarrito();
  renderPayPal();
}

function mostrarCarrito(){
  let lista = document.getElementById("lista-carrito");
  lista.innerHTML = "";

  carrito.forEach((item,i)=>{
    lista.innerHTML += `<li>${item.nombre} $${item.precio}
    <button onclick="eliminar(${i})">X</button></li>`;
  });

  document.getElementById("total").textContent = "Total: $" + total;
}

function eliminar(i){
  total -= carrito[i].precio;
  carrito.splice(i,1);
  mostrarCarrito();
  renderPayPal();
}

/* 🔓 DESBLOQUEAR */
function desbloquearDescargas(){

  document.getElementById("descargas").style.display = "block";

  carrito.forEach(item=>{
    document.getElementById(item.nombre).style.display = "block";
  });

  window.scrollTo(0,document.body.scrollHeight);
}

/* 💰 PAYPAL */
function renderPayPal(){

  document.getElementById("paypal-button-container").innerHTML = "";

  if(total === 0) return;

  paypal.Buttons({

    fundingSource: paypal.FUNDING.PAYPAL,

    createOrder: (data, actions)=>{
      return actions.order.create({
        purchase_units: [{
          amount: { value: total.toFixed(2) }
        }]
      });
    },

    onApprove: (data, actions)=>{
      return actions.order.capture().then(()=>{
        alert("Pago completado");

        desbloquearDescargas();

        carrito=[];
        total=0;
        mostrarCarrito();
        renderPayPal();
      });
    }

  }).render('#paypal-button-container');

}

</script>

</body>
</html>
