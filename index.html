<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursos de Excel - Sandra Infante</title>

<!-- PAYPAL REAL -->
<script src="https://www.paypal.com/sdk/js?client-id=AQjsKr-mCYAxSAOx_0Azxop1vw2R7kxqC4abCeC6pZBzNLK1sNjWI3DZh6iyJtpkpHmQ7EMFyV7S7_Wr&currency=MXN"></script>

<style>

body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#f5f5f5;
  padding-bottom:180px;
}

header{
  text-align:center;
  background:#0a5c36;
  color:white;
  padding:20px;
}

.productos{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.producto{
  background:white;
  padding:15px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.producto img{
  width:100%;
  max-width:180px;
}

button{
  background:#0a5c36;
  color:white;
  border:none;
  padding:10px;
  cursor:pointer;
  border-radius:5px;
}

button:hover{
  background:#084d2c;
}

.carrito{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:white;
  border-top:4px solid #0a5c36;
  padding:15px;
  box-shadow:0 -2px 15px rgba(0,0,0,0.2);
}

.carrito ul{
  max-height:120px;
  overflow:auto;
  padding:0;
}

.carrito li{
  list-style:none;
  display:flex;
  justify-content:space-between;
  margin-bottom:5px;
  font-size:14px;
}

.eliminar{
  background:red;
  border:none;
  color:white;
  cursor:pointer;
  border-radius:3px;
  padding:2px 6px;
}

.total{
  font-weight:bold;
  margin-top:10px;
}

#paypal-button-container{
  margin-top:10px;
}

</style>
</head>

<body>

<header>
  <h1>📊 Cursos de Excel & Power BI</h1>
</header>

<section class="productos">

<div class="producto">
  <img src="img/logo excel basico.png">
  <h2>Excel Básico</h2>
  <p>$600 MXN</p>
  <button onclick="agregarCarrito('Excel Básico',600)">Agregar</button>
</div>

<div class="producto">
  <img src="img/logo excel intermedio.png">
  <h2>Excel Intermedio</h2>
  <p>$600 MXN</p>
  <button onclick="agregarCarrito('Excel Intermedio',600)">Agregar</button>
</div>

<div class="producto">
  <img src="img/logo Excel Avanzado.png">
  <h2>Excel Avanzado</h2>
  <p>$600 MXN</p>
  <button onclick="agregarCarrito('Excel Avanzado',600)">Agregar</button>
</div>

<div class="producto">
  <img src="img/logo power bi basico.png">
  <h2>Power BI Básico</h2>
  <p>$600 MXN</p>
  <button onclick="agregarCarrito('Power BI Básico',600)">Agregar</button>
</div>

</section>

<div class="carrito">
  <h3>🛒 Carrito</h3>
  <ul id="lista-carrito"></ul>
  <p class="total" id="total">Total: $0 MXN</p>

  <div id="paypal-button-container"></div>
</div>

<script>

let carrito = [];
let total = 0;

function agregarCarrito(nombre, precio){
  carrito.push({nombre, precio});
  total += precio;
  mostrarCarrito();
  renderPayPal();
}

function eliminarProducto(index){
  total -= carrito[index].precio;
  carrito.splice(index,1);
  mostrarCarrito();
  renderPayPal();
}

function mostrarCarrito(){
  let lista = document.getElementById("lista-carrito");
  lista.innerHTML = "";

  carrito.forEach((item,index) => {
    let li = document.createElement("li");
    li.innerHTML = `
      ${item.nombre} - $${item.precio}
      <button class="eliminar" onclick="eliminarProducto(${index})">X</button>
    `;
    lista.appendChild(li);
  });

  document.getElementById("total").textContent = "Total: $" + total + " MXN";
}

function renderPayPal(){

  document.getElementById("paypal-button-container").innerHTML = "";

  if(total === 0) return;

  paypal.Buttons({

    createOrder: function(data, actions){
      return actions.order.create({
        purchase_units: [{
          amount: {
            value: total.toFixed(2)
          }
        }]
      });
    },

    onApprove: function(data, actions){
      return actions.order.capture().then(function(details){
        alert("✅ Pago completado por " + details.payer.name.given_name);

        carrito = [];
        total = 0;
        mostrarCarrito();
        renderPayPal();
      });
    }

  }).render('#paypal-button-container');
}

</script>

</body>
</html>
